<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sonu Shukla | Photography Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#0e0e0e;
  color:#fff;
}

/* ===== HERO (16:9 FIXED) ===== */
.hero{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:
    linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.75)),
    url("hero.jpg") center/cover no-repeat;
}

/* TOP LEFT BAR */
.topbar{
  position:absolute;
  top:20px;
  left:20px;
  display:flex;
  align-items:center;
  gap:14px;
  z-index:2;
}

.profile{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #444;
}

.top-social a{
  color:#fff;
  font-size:18px;
  margin-right:8px;
  text-decoration:none;
}
.top-social a:hover{opacity:.7}

/* LEFT MID TEXT */
.hero-content{
  position:absolute;
  left:20px;
  top:50%;
  transform:translateY(-50%);
}

.hero-content h1{
  margin:0;
  font-size:26px;
}

.tagline{
  margin-top:6px;
  font-size:13px;
  color:#bbb;
}

/* ===== SECTIONS ===== */
section{
  padding:30px 18px;
}

h2{
  font-size:18px;
  border-bottom:1px solid #333;
  padding-bottom:6px;
  margin-bottom:15px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
  gap:12px;
}
.grid img{
  width:100%;
  border-radius:8px;
}

/* CONTACT */
.contact{
  text-align:center;
}
.contact a{
  display:inline-block;
  margin:12px;
  color:#fff;
  text-decoration:none;
}
.contact i{
  font-size:22px;
}
.contact span{
  display:block;
  font-size:12px;
  color:#aaa;
  margin-top:4px;
}

/* FOOTER */
footer{
  text-align:center;
  padding:25px;
  font-size:13px;
  color:#777;
}

/* MOBILE ADJUST */
@media(max-width:768px){
  .hero{
    aspect-ratio:4/5; /* mobile pe thoda tall but NOT portrait */
  }
  .hero-content h1{
    font-size:22px;
  }
}
</style>
</head>

<body>

<header class="hero">

  <!-- TOP LEFT -->
  <div class="topbar">
    <img src="profile.jpg" class="profile" alt="Sonu Shukla">
    <div class="top-social">
      <a href="https://instagram.com/iamsonushukla" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://x.com/iamsonushukla" target="_blank"><i class="fab fa-x-twitter"></i></a>
      <a href="https://youtube.com/@iamsonushukla" target="_blank"><i class="fab fa-youtube"></i></a>
      <a href="https://facebook.com/iamsonushukla" target="_blank"><i class="fab fa-facebook"></i></a>
      <a href="mailto:iamsonushukla@outlook.in"><i class="fa-solid fa-envelope"></i></a>
    </div>
  </div>

  <!-- LEFT MID -->
  <div class="hero-content">
    <h1>Sonu Shukla</h1>
    <div class="tagline">
      Photographer • Video & Photo Editor • Graphic Designer
    </div>
  </div>

</header>

<section>
<h2>Portrait</h2>
<div class="grid">
  <img src="portrait1.jpg">
  <img src="portrait2.jpg">
</div>
</section>

<section>
<h2>Street</h2>
<div class="grid">
  <img src="street1.jpg">
  <img src="street2.jpg">
</div>
</section>

<section>
<h2>Wildlife</h2>
<div class="grid">
  <img src="wildlife1.jpg">
  <img src="wildlife2.jpg">
</div>
</section>

<section>
<h2>Nature</h2>
<div class="grid">
  <img src="nature1.jpg">
  <img src="nature2.jpg">
</div>
</section>

<section class="contact">
<h2>Contact</h2>

<i class="fab fa-instagram"></i><span>@iamsonushukla</span>
</a>

<a href="https://x.com/iamsonushukla" target="_blank">
<i class="fab fa-x-twitter"></i><span>@iamsonushukla</span>

<i class="fab fa-youtube"></i><span>@iamsonushukla</span>

</a>

</section>

<footer>
© 2026 Sonu Shukla • sonushukla.in
</footer>

</body>
</html>

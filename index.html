<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sonu Shukla | Photography Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#0e0e0e;
  color:#fff;
  overflow-x:hidden;
}

/* ================= HERO ================= */
.hero{
  position:relative;
  width:100%;
  height:85vh;
  background-image:
    linear-gradient(rgba(0,0,0,.4), rgba(0,0,0,.8)),
    url("hero.jpg");
  background-size:cover;
  background-repeat:no-repeat;
  background-position:center top;
  overflow:hidden;
}

/* HERO TEXT */
.hero-text{
  position:absolute;
  left:20px;
  bottom:22%;
  z-index:5;
}
.hero-text h1{
  margin:0;
  font-size:30px;
}
.hero-text p{
  margin-top:6px;
  font-size:14px;
  color:#bbb;
}

/* ================= TOP LEFT ICONS ================= */
.topbar{
  position:absolute;
  top:20px;
  left:20px;
  z-index:50;
}
.stack{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.menu-btn{
  font-size:24px;
  cursor:pointer;
}
.mini-icons{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.mini-icons a{
  color:#fff;
  font-size:18px;
  text-decoration:none;
}

/* ================= MENU ================= */
.menu-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  z-index:60;
}
.menu-overlay.active{display:block;}

.menu{
  position:fixed;
  top:0;
  left:-260px;
  width:260px;
  height:100%;
  background:#111;
  padding:80px 20px;
  transition:.3s;
  z-index:70;
}
.menu.active{left:0;}
.menu a{
  display:block;
  color:#fff;
  text-decoration:none;
  margin:15px 0;
}

/* ================= SECTIONS ================= */
section{padding:40px 18px;}
h2{
  font-size:18px;
  border-bottom:1px solid #333;
  padding-bottom:6px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
}
.grid img{
  width:100%;
  border-radius:8px;
}

/* ================= LIGHTBOX ================= */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
}
.lightbox.active{display:flex;}
.lightbox img{
  max-width:90%;
  max-height:90%;
}

/* ================= PAYMENT ================= */
.payment{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2100;
}
.payment.active{display:flex;}
.paybox{
  background:#111;
  padding:25px;
  border-radius:10px;
  max-width:320px;
  width:90%;
  text-align:center;
}

/* ================= FOOTER ================= */
footer{
  text-align:center;
  padding:25px;
  font-size:13px;
  color:#777;
}

/* ================================================= */
/* ================= RESPONSIVE MAGIC ============== */
/* ================================================= */

/* MOBILE (already perfect – keep as is) */
@media(max-width:768px){
  .hero{height:65vh;}
  .hero-text h1{font-size:26px;}
}

/* DESKTOP FIX (THIS IS WHAT YOU ASKED) */
@media(min-width:1024px){
  .hero{
    background-size:110%;        /* 🔥 desktop thoda zoom-out */
    background-position:center top;
  }

  .hero-text{
    bottom:18%;                  /* 🔥 text upar */
  }

  .hero-text h1{
    font-size:26px;              /* 🔥 desktop text smaller */
  }

  .hero-text p{
    font-size:13px;
  }
}
</style>
</head>

<body>

<div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

<div class="menu" id="menu">
  <a href="#top" onclick="closeMenu()">Home</a>
  <a href="#portrait" onclick="closeMenu()">Portrait</a>
  <a href="#street" onclick="closeMenu()">Street</a>
  <a href="#wildlife" onclick="closeMenu()">Wildlife</a>
  <a href="#nature" onclick="closeMenu()">Nature</a>
</div>

<header class="hero" id="top">
  <div class="topbar">
    <div class="stack">
      <div class="menu-btn" onclick="openMenu()">☰</div>
      <div class="mini-icons">
        <a href="mailto:contact@sonushukla.in"><i class="fa-solid fa-envelope"></i></a>
        <a href="javascript:void(0)" onclick="openPayment()"><i class="fa-solid fa-indian-rupee-sign"></i></a>
        <a href="https://instagram.com/iamsonushukla" target="_blank"><i class="fab fa-instagram"></i></a>
      </div>
    </div>
  </div>

  <div class="hero-text">
    <h1>Sonu Shukla</h1>
    <p>Photographer • Editor • Graphic Designer</p>
  </div>
</header>

<section id="portrait">
<h2>Portrait</h2>
<div class="grid">
  <img src="portrait1.jpg">
  <img src="portrait2.jpg">
</div>
</section>

<footer>© 2026 Sonu Shukla • sonushukla.in</footer>

<script>
function openMenu(){
  menu.classList.add("active");
  menuOverlay.classList.add("active");
}
function closeMenu(){
  menu.classList.remove("active");
  menuOverlay.classList.remove("active");
}
function openPayment(){
  payment.classList.add("active");
}
</script>

</body>
</html>

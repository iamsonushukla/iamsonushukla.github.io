<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sonu Shukla | Photography Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- FONT AWESOME ICONS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#0e0e0e;
  color:#fff;
}

/* HERO */
.hero{
  position:relative;
  min-height:100vh;
  background:
    linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
    url("hero.jpg") center/cover no-repeat;
}

/* TOP LEFT BAR */
.top-bar{
  position:absolute;
  top:20px;
  left:20px;
  display:flex;
  align-items:center;
  gap:15px;
  z-index:10;
}

.profile{
  width:80px;
  height:80px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #333;
}

.top-social a{
  color:#fff;
  font-size:18px;
  margin-right:10px;
  text-decoration:none;
}

/* HERO TEXT */
.hero-text{
  position:absolute;
  left:20px;
  top:50%;
  transform:translateY(-50%);
}

.hero-text h1{
  font-size:32px;
  margin:0 0 8px 0;
}

.tagline{
  font-size:14px;
  color:#bbb;
}

/* SECTIONS */
section{
  padding:28px 18px;
}

h2{
  font-size:18px;
  border-bottom:1px solid #333;
  padding-bottom:6px;
  margin-bottom:15px;
}

/* IMAGE GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
  gap:12px;
}

.grid img{
  width:100%;
  border-radius:8px;
}

/* CONTACT */
.contact{
  text-align:center;
}

.contact a{
  display:inline-block;
  margin:12px;
  color:#fff;
  font-size:20px;
  text-decoration:none;
}

.contact span{
  display:block;
  font-size:13px;
  color:#aaa;
  margin-top:4px;
}

/* FOOTER */
footer{
  text-align:center;
  padding:25px;
  color:#777;
  font-size:13px;
}

/* MOBILE */
@media(max-width:600px){
  .hero-text{
    position:static;
    transform:none;
    padding:140px 20px 40px;
  }
}
</style>
</head>

<body>

<!-- HERO -->
<header class="hero">

  <!-- TOP LEFT -->
  <div class="top-bar">
    <img src="profile.jpg" class="profile" alt="Sonu Shukla">

    <div class="top-social">
      <a href="https://instagram.com/iamsonushukla" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://x.com/iamsonushukla" target="_blank"><i class="fab fa-x-twitter"></i></a>
      <a href="https://youtube.com/@iamsonushukla" target="_blank"><i class="fab fa-youtube"></i></a>
      <a href="https://facebook.com/iamsonushukla" target="_blank"><i class="fab fa-facebook"></i></a>
      <a href="mailto:iamsonushukla@outlook.in"><i class="fa-solid fa-envelope"></i></a>
    </div>
  </div>

  <!-- LEFT CENTER TEXT -->
  <div class="hero-text">
    <h1>Sonu Shukla</h1>
    <p class="tagline">
      Photographer • Video & Photo Editor • Graphic Designer
    </p>
  </div>

</header>

<!-- PORTRAIT -->
<section>
<h2>Portrait</h2>
<div class="grid">
  <img src="portrait1.jpg">
  <img src="portrait2.jpg">
</div>
</section>

<!-- STREET -->
<section>
<h2>Street</h2>
<div class="grid">
  <img src="street1.jpg">
  <img src="street2.jpg">
</div>
</section>

<!-- WILDLIFE -->
<section>
<h2>Wildlife</h2>
<div class="grid">
  <img src="wildlife1.jpg">
  <img src="wildlife2.jpg">
</div>
</section>

<!-- NATURE -->
<section>
<h2>Nature</h2>
<div class="grid">
  <img src="nature1.jpg">
  <img src="nature2.jpg">
</div>
</section>

<!-- CONTACT -->
<section class="contact">
<h2>Contact</h2>

<a href="https://instagram.com/iamsonushukla" target="_blank">
  <i class="fab fa-instagram"></i>
  <span>@iamsonushukla</span>
</a>

<a href="https://x.com/iamsonushukla" target="_blank">
  <i class="fab fa-x-twitter"></i>
  <span>@iamsonushukla</span>
</a>

<a href="https://youtube.com/@iamsonushukla" target="_blank">
  <i class="fab fa-youtube"></i>
  <span>@iamsonushukla</span>
</a>

<a href="https://facebook.com/iamsonushukla" target="_blank">
  <i class="fab fa-facebook"></i>
  <span>@iamsonushukla</span>
</a>

<a href="mailto:iamsonushukla@outlook.in">
  <i class="fa-solid fa-envelope"></i>
  <span>iamsonushukla@outlook.in</span>
</a>

</section>

<footer>
© 2026 Sonu Shukla • sonushukla.in
</footer>

</body>
</html>

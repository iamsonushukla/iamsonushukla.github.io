<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sonu Shukla | Photography Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- FONT AWESOME ICONS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#0e0e0e;
  color:#fff;
}

/* HERO SECTION */
.hero{
  text-align:center;
  padding:100px 20px;
  background:
    linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
    url("hero.jpg") center/cover no-repeat;
}

.profile{
  width:140px;
  height:140px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #333;
  margin-bottom:15px;
}

h1{
  margin:10px 0;
  font-size:30px;
}

.tagline{
  color:#bbb;
  font-size:14px;
}

/* SOCIAL ICONS */
.social{
  margin-top:20px;
}

.social a{
  color:#fff;
  margin:0 12px;
  font-size:22px;
  text-decoration:none;
  transition:0.3s;
}

.social a:hover{
  opacity:0.7;
}

/* SECTIONS */
section{
  padding:25px 18px;
}

h2{
  font-size:18px;
  border-bottom:1px solid #333;
  padding-bottom:6px;
  margin-bottom:15px;
}

/* IMAGE GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
  gap:10px;
}

.grid img{
  width:100%;
  border-radius:8px;
}

/* FOOTER */
footer{
  text-align:center;
  padding:25px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<!-- HERO -->
<header class="hero">
  <img src="profile.jpg" class="profile" alt="Sonu Shukla">
  <h1>Sonu Shukla</h1>
  <p class="tagline">
    Photographer • Video & Photo Editor • Graphic Designer
  </p>

  <div class="social">
    <a href="https://instagram.com/iamsonushukla" target="_blank">
      <i class="fab fa-instagram"></i>
    </a>
    <a href="https://threads.net/@iamsonushukla" target="_blank">
      <i class="fab fa-threads"></i>
    </a>
    <a href="https://x.com/iamsonushukla" target="_blank">
      <i class="fab fa-x-twitter"></i>
    </a>
    <a href="https://youtube.com/@iamsonushukla" target="_blank">
      <i class="fab fa-youtube"></i>
    </a>
    <a href="https://facebook.com/iamsonushukla" target="_blank">
      <i class="fab fa-facebook"></i>
    </a>
  </div>
</header>

<!-- PORTFOLIO -->
<section>
<h2>Macro Photography</h2>
<div class="grid">
  <img src="macro1.jpg">
  <img src="macro2.jpg">
</div>
</section>

<section>
<h2>Wildlife Photography</h2>
<div class="grid">
  <img src="wild1.jpg">
  <img src="wild2.jpg">
</div>
</section>

<section>
<h2>Portrait Photography</h2>
<div class="grid">
  <img src="portrait1.jpg">
  <img src="portrait2.jpg">
</div>
</section>

<section>
<h2>Street Photography</h2>
<div class="grid">
  <img src="street1.jpg">
  <img src="street2.jpg">
</div>
</section>

<section>
<h2>Nature Photography</h2>
<div class="grid">
  <img src="nature1.jpg">
  <img src="nature2.jpg">
</div>
</section>

<footer>
© 2026 Sonu Shukla • sonushukla.in
</footer>

</body>
</html>

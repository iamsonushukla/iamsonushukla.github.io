<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sonu Shukla | Photography Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#0e0e0e;
  color:#fff;
  overflow-x:hidden;
}

/* ===== FIXED TOP STRIPE ===== */
.topbar{
  position:fixed;
  top:0; left:0;
  width:100%;
  height:64px;
  background:rgba(0,0,0,.85);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  z-index:1000;
}

.leftbar{
  display:flex;
  align-items:center;
  gap:12px;
}

.profile{
  width:42px;
  height:42px;
  border-radius:50%;
  border:2px solid #444;
  cursor:pointer;
}

.social a{
  color:#fff;
  margin-right:8px;
  font-size:16px;
  text-decoration:none;
}

.menu-btn{
  font-size:22px;
  cursor:pointer;
}

/* ===== HERO ===== */
.hero{
  margin-top:64px;
  height:75vh;
  background:
    linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.7)),
    url("hero.jpg") center/cover no-repeat;
  position:relative;
}

.hero-text{
  position:absolute;
  left:20px;
  top:50%;
  transform:translateY(-50%);
}
.hero-text h1{margin:0;font-size:30px;}
.hero-text p{color:#bbb;font-size:14px;margin-top:6px;}

/* ===== SECTIONS ===== */
section{
  padding:60px 18px;
}
h2{
  border-bottom:1px solid #333;
  padding-bottom:6px;
  font-size:18px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
}
.grid img{
  width:100%;
  border-radius:8px;
  cursor:pointer;
  transition:.3s;
}
.grid img:hover{transform:scale(1.05);}

/* ===== SLIDE MENU ===== */
.overlay{
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.6);
  display:none;
  z-index:998;
}
.overlay.active{display:block;}

.side-menu{
  position:fixed;
  top:0; left:-260px;
  width:260px;
  height:100%;
  background:#111;
  padding:80px 20px;
  transition:.3s;
  z-index:999;
}
.side-menu.active{left:0;}
.side-menu a{
  display:block;
  color:#fff;
  text-decoration:none;
  margin:18px 0;
  font-size:16px;
}

/* ===== LIGHTBOX ===== */
.lightbox{
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
}
.lightbox.active{display:flex;}
.lightbox img{
  max-width:90%;
  max-height:90%;
}
.lightbox span{
  position:absolute;
  top:20px; right:25px;
  font-size:28px;
  cursor:pointer;
}

/* FOOTER */
footer{
  text-align:center;
  padding:25px;
  color:#777;
  font-size:13px;
}

/* MOBILE */
@media(max-width:768px){
  .hero{height:60vh;}
}
</style>
</head>

<body>

<!-- TOP STRIPE -->
<div class="topbar">
  <div class="leftbar">
    <img src="profile.jpg" class="profile" onclick="goHome()">
    <div class="social">
      <a href="https://instagram.com/iamsonushukla"><i class="fab fa-instagram"></i></a>
      <a href="https://x.com/iamsonushukla"><i class="fab fa-x-twitter"></i></a>
      <a href="https://youtube.com/@iamsonushukla"><i class="fab fa-youtube"></i></a>
      <a href="https://facebook.com/iamsonushukla"><i class="fab fa-facebook"></i></a>
    </div>
  </div>
  <div class="menu-btn" onclick="openMenu()">☰</div>
</div>

<!-- HERO -->
<div class="hero" id="home">
  <div class="hero-text">
    <h1>Sonu Shukla</h1>
    <p>Photographer • Editor • Graphic Designer</p>
  </div>
</div>

<!-- HOME PREVIEW -->
<section id="portrait" class="preview">
<h2>Portrait</h2>
<div class="grid">
  <img src="portrait1.jpg" onclick="openLightbox(this)">
  <img src="portrait2.jpg" onclick="openLightbox(this)">
</div>
</section>

<section id="street" class="preview">
<h2>Street</h2>
<div class="grid">
  <img src="street1.jpg" onclick="openLightbox(this)">
  <img src="street2.jpg" onclick="openLightbox(this)">
</div>
</section>

<section id="wildlife" class="preview">
<h2>Wildlife</h2>
<div class="grid">
  <img src="wildlife1.jpg" onclick="openLightbox(this)">
  <img src="wildlife2.jpg" onclick="openLightbox(this)">
</div>
</section>

<section id="nature" class="preview">
<h2>Nature</h2>
<div class="grid">
  <img src="nature1.jpg" onclick="openLightbox(this)">
  <img src="nature2.jpg" onclick="openLightbox(this)">
</div>
</section>

<!-- ABOUT (LAST) -->
<section id="about" style="text-align:center;">
<h2>About Me</h2>
<img src="about.jpg" style="width:120px;height:120px;border-radius:50%;border:2px solid #444;">
<p style="max-width:700px;margin:auto;line-height:1.8;color:#ccc;">
I don’t just take photos — I preserve moments.
</p>
</section>

<footer>
© 2026 Sonu Shukla • sonushukla.in
</footer>

<!-- SLIDE MENU -->
<div class="overlay" onclick="closeMenu()"></div>
<div class="side-menu">
  <a href="#" onclick="openCategory('portrait')">Portrait</a>
  <a href="#" onclick="openCategory('street')">Street</a>
  <a href="#" onclick="openCategory('wildlife')">Wildlife</a>
  <a href="#" onclick="openCategory('nature')">Nature</a>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span onclick="closeLightbox()">×</span>
  <img id="lightboxImg">
</div>

<script>
let sections=document.querySelectorAll("section.preview");

function openMenu(){
  document.querySelector(".side-menu").classList.add("active");
  document.querySelector(".overlay").classList.add("active");
}
function closeMenu(){
  document.querySelector(".side-menu").classList.remove("active");
  document.querySelector(".overlay").classList.remove("active");
}

function openCategory(id){
  sections.forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
  history.pushState({page:id},"","#"+id);
  closeMenu();
}

function goHome(){
  sections.forEach(s=>s.style.display="block");
  history.pushState({page:"home"},"","#");
  window.scrollTo(0,0);
}

window.onpopstate=function(){
  goHome();
}

function openLightbox(img){
  document.getElementById("lightboxImg").src=img.src;
  document.getElementById("lightbox").classList.add("active");
}
function closeLightbox(){
  document.getElementById("lightbox").classList.remove("active");
}
document.getElementById("lightbox").onclick=e=>{
  if(e.target.id==="lightbox") closeLightbox();
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeLightbox();
});
</script>

</body>
</html>

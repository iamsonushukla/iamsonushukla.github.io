<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sonu Shukla | Photography Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#0e0e0e;
  color:#fff;
}

.hero{
  position:relative;
  width:100%;
  height:80vh;
  background:
    linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.75)),
    url("hero.jpg") center top / cover no-repeat;
}

/* TOP LEFT */
.topbar{
  position:absolute;
  top:20px;
  left:20px;
  display:flex;
  align-items:center;
  gap:12px;
}

.profile{
  width:48px;
  height:48px;
  border-radius:50%;
  border:2px solid #444;
}

.top-social a{
  color:#fff;
  margin-right:8px;
  font-size:18px;
  text-decoration:none;
}

/* HERO TEXT */
.hero-text{
  position:absolute;
  left:20px;
  top:50%;
  transform:translateY(-50%);
}
.hero-text h1{margin:0;font-size:30px;}
.hero-text p{color:#bbb;font-size:14px;margin-top:6px;}

/* SECTIONS */
section{
  padding:60px 18px;
}
h2{
  font-size:18px;
  border-bottom:1px solid #333;
  padding-bottom:6px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
}
.grid img{
  width:100%;
  border-radius:8px;
  cursor:pointer;
  transition:.3s;
}
.grid img:hover{transform:scale(1.05);}

/* LIGHTBOX */
.lightbox{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.lightbox.active{display:flex;}
.lightbox img{
  max-width:90%;
  max-height:90%;
}
.lightbox span{
  position:absolute;
  top:20px;right:25px;
  font-size:28px;
  cursor:pointer;
}

/* CONTACT */
.contact{text-align:center;}
.contact a{
  display:inline-block;
  margin:12px;
  color:#fff;
  text-decoration:none;
}
.contact i{font-size:22px;}
.contact span{
  display:block;
  font-size:12px;
  color:#aaa;
}

/* FOOTER */
footer{
  text-align:center;
  padding:25px;
  font-size:13px;
  color:#777;
}

/* MOBILE */
@media(max-width:768px){
  .hero{height:60vh;}
  .hero-text h1{font-size:22px;}
}
</style>
</head>

<body>

<header class="hero">

  <div class="topbar">
    <img src="profile.jpg" class="profile">
    <div class="top-social">
      <a href="https://instagram.com/iamsonushukla"><i class="fab fa-instagram"></i></a>
      <a href="https://x.com/iamsonushukla"><i class="fab fa-x-twitter"></i></a>
      <a href="https://youtube.com/@iamsonushukla"><i class="fab fa-youtube"></i></a>
      <a href="https://facebook.com/iamsonushukla"><i class="fab fa-facebook"></i></a>
    </div>
  </div>

  <div class="hero-text">
    <h1>Sonu Shukla</h1>
    <p>Photographer • Editor • Graphic Designer</p>
  </div>

</header>

<section>
<h2>Portrait</h2>
<div class="grid">
  <img src="portrait1.jpg" onclick="openLightbox(this)">
  <img src="portrait2.jpg" onclick="openLightbox(this)">
</div>
</section>

<section>
<h2>Street</h2>
<div class="grid">
  <img src="street1.jpg" onclick="openLightbox(this)">
  <img src="street2.jpg" onclick="openLightbox(this)">
</div>
</section>

<section>
<h2>Wildlife</h2>
<div class="grid">
  <img src="wildlife1.jpg" onclick="openLightbox(this)">
  <img src="wildlife2.jpg" onclick="openLightbox(this)">
</div>
</section>

<section>
<h2>Nature</h2>
<div class="grid">
  <img src="nature1.jpg" onclick="openLightbox(this)">
  <img src="nature2.jpg" onclick="openLightbox(this)">
</div>
</section>

<section class="contact">
<h2>Contact</h2>
<a href="https://instagram.com/iamsonushukla"><i class="fab fa-instagram"></i><span>@iamsonushukla</span></a>
<a href="https://x.com/iamsonushukla"><i class="fab fa-x-twitter"></i><span>@iamsonushukla</span></a>
<a href="https://youtube.com/@iamsonushukla"><i class="fab fa-youtube"></i><span>@iamsonushukla</span></a>
<a href="https://facebook.com/iamsonushukla"><i class="fab fa-facebook"></i><span>@iamsonushukla</span></a>
</section>

<footer>
© 2026 Sonu Shukla • sonushukla.in
</footer>

<div class="lightbox" id="lightbox">
  <span onclick="closeLightbox()">×</span>
  <img id="lightboxImg">
</div>

<script>
function openLightbox(img){
  document.getElementById("lightboxImg").src=img.src;
  document.getElementById("lightbox").classList.add("active");
}
function closeLightbox(){
  document.getElementById("lightbox").classList.remove("active");
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeLightbox();
});
</script>

</body>
</html>
